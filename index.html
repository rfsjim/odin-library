<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Odin Library</title>
</head>
<body>
    <div id="container">
        <h1>An Odin Library</h1>
        <button id="addBooksBtn">Add New Book</button>
        <dialog id="addBooksModal">
            <h2>Add Books to Library</h2>
            <form action="#" id="addBooksForm">
                <label for="title">What is the Book's Title?: </label>
                <input type="text" name="title" id="title">
                <label for="author">Who is the Author?: </label>
                <input type="text" name="author" id="author">
                <label for="pages">How Many Pages?: </label>
                <input type="number" name="pages" id="pages" step="1" value="1">
                <label for="read">Have you read it?: </label>
                <select name="read" id="read">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
                <input type="submit" value="Save">
                <input type="reset" value="Clear">
            </form>
            <button id="closeBtn">Close</button>
        </dialog>
        <div id="catalogue">
        </div>
    </div>
    <script src="./js/library.js">
    </script>
</body>
</html>
